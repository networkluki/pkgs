<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">NetworkLuki Packages icon</title>
  <desc id="desc">Blue software package box with APT .deb text and a security key badge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="100%" stop-color="#0b1f55"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2c78"/>
      <stop offset="100%" stop-color="#081a45"/>
    </linearGradient>
    <linearGradient id="boxWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe7ff"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020817" flood-opacity="0.5"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="52" fill="url(#bg)"/>
  <circle cx="382" cy="126" r="116" fill="#1d4ed8" opacity="0.12"/>
  <circle cx="118" cy="394" r="136" fill="#0ea5e9" opacity="0.12"/>
  <g filter="url(#shadow)" transform="translate(54 58)">
    <path d="M74 70 255 28l122 66-178 42z" fill="url(#boxWhite)" stroke="#12357c" stroke-width="5"/>
    <path d="M74 70v203c0 13 10 24 24 24l101 58V152z" fill="url(#panel)" stroke="#12357c" stroke-width="5"/>
    <path d="M199 152v203l108-53c10-5 16-14 16-25V136z" fill="url(#boxWhite)" stroke="#12357c" stroke-width="5"/>
    <path d="M155 51 224 36l78 43-67 16z" fill="url(#glow)" filter="url(#softGlow)"/>
    <path d="M224 36v102l21-11V48z" fill="#2563eb"/>
    <path d="M224 128v36l21-15v-45z" fill="#0f1f5c"/>
    <path d="M161 58 235 95" stroke="#0f1f5c" stroke-width="6" stroke-linecap="round"/>
    <path d="M275 47 197 66" stroke="#0f1f5c" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(106 168)">
      <text x="0" y="0" fill="#ffffff" font-family="Ubuntu, Arial, sans-serif" font-size="66" font-weight="800">APT</text>
      <rect x="2" y="18" width="72" height="10" rx="5" fill="#38bdf8"/>
      <text x="0" y="78" fill="#38bdf8" font-family="Ubuntu, Arial, sans-serif" font-size="48" font-weight="700">.deb</text>
    </g>
    <g transform="translate(232 164)" stroke="url(#glow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="0" y="0" width="82" height="112" rx="14"/>
      <path d="M20 26h42"/>
      <path d="M20 54h42"/>
      <path d="M20 82h28"/>
