  </g>
  <g filter="url(#shadow)" transform="translate(307 316)">
    <circle cx="70" cy="70" r="70" fill="url(#glow)"/>
    <circle cx="70" cy="70" r="53" fill="#061433" stroke="#12357c" stroke-width="6"/>
    <path d="M88 43a18 18 0 1 0-25 17v28h12l7-7h10l5-5h9V64c8-3 14-11 14-21 0-10-5-18-14-22-7-4-14-4-18-4zm-18 0a11 11 0 1 1 22 0 11 11 0 0 1-22 0z" fill="#ffffff"/>
